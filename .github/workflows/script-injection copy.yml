name: Label Issues (Script Injection Scripts)
on:
  issues:
    types:
      - opened
jobs:
  assign-label:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Label
        run: |
          issue_title="{{ github.event.issue.title }}"
          id [[ "$issue_title" == *"bug"* ]]; then
          echo "Issue is about a bug!"
          else
          echo "Issue is not in the bug"
          fi